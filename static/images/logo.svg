<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="Phone Store">
  <defs>
    <!-- Corps du téléphone : charbon profond -->
    <linearGradient id="psFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3646"/>
      <stop offset="100%" stop-color="#131a25"/>
    </linearGradient>
    <!-- Écran : dégradé sombre -->
    <linearGradient id="psScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1017"/>
      <stop offset="100%" stop-color="#1b2331"/>
    </linearGradient>
    <!-- Or / ambre : dégradé signature -->
    <linearGradient id="psGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="55%" stop-color="#ffb224"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>
    <!-- Halo magique -->
    <radialGradient id="psGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb224" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffb224" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffb224" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo lumineux derrière le téléphone -->
  <circle cx="40" cy="40" r="34" fill="url(#psGlow)"/>

  <!-- Téléphone (légèrement incliné pour le dynamisme) -->
  <g transform="rotate(-12 40 42)">
    <!-- Corps avec liseré doré -->
    <rect x="21" y="7" width="38" height="66" rx="10" fill="url(#psFrame)" stroke="url(#psGold)" stroke-width="2.4"/>
    <!-- Écran -->
    <rect x="25.5" y="12" width="29" height="56" rx="6.5" fill="url(#psScreen)"/>
    <!-- Encoche (haut-parleur) -->
    <rect x="33" y="15" width="14" height="4" rx="2" fill="#ffb224"/>
    <!-- Reflet subtil sur l'écran -->
    <path d="M29 18 h7 l-4.5 12 h-7 z" fill="#ffffff" opacity="0.05"/>
  </g>

  <!-- Étincelle magique principale sur l'écran -->
  <g transform="rotate(-12 40 42)">
    <path d="M40 24 l3.4 8.2 8.2 3.4 -8.2 3.4 -3.4 8.2 -3.4 -8.2 -8.2 -3.4 8.2 -3.4 z"
          fill="url(#psGold)"/>
    <circle cx="40" cy="35.6" r="2.7" fill="#0d1017"/>
  </g>

  <!-- Petites étincelles flottantes -->
  <path d="M62 16 l1.7 4 4 1.7 -4 1.7 -1.7 4 -1.7 -4 -4 -1.7 4 -1.7 z" fill="#ffd166" opacity="0.95"/>
  <path d="M69 42 l1.3 3 3 1.3 -3 1.3 -1.3 3 -1.3 -3 -3 -1.3 3 -1.3 z" fill="#ffb224" opacity="0.75"/>
  <circle cx="19" cy="20" r="2.2" fill="#ffd166" opacity="0.9"/>
  <circle cx="14" cy="55" r="1.7" fill="#ffb224" opacity="0.65"/>
</svg>
