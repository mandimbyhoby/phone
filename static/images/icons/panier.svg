<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="Panier">
  <defs>
    <linearGradient id="cartGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="55%" stop-color="#ffb224"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>
    <!-- Ombre du panier (effet 3D dessous) -->
    <linearGradient id="cartShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2b12"/>
      <stop offset="100%" stop-color="#1d1608"/>
    </linearGradient>
    <radialGradient id="cartGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb224" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffb224" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffb224" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo magique -->
  <circle cx="14" cy="14" r="13.5" fill="url(#cartGlow)"/>

  <!-- Anse du panier -->
  <path d="M7.5 7.5 a 4.6 4.6 0 0 1 9.2 0" fill="none" stroke="url(#cartGold)" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Corps du panier (profil trapézoïdal, rendu 3D) -->
  <path d="M6 9 h16 l-1.6 12.2 a 2.2 2.2 0 0 1 -2.2 1.9 H9.8 a 2.2 2.2 0 0 1 -2.2 -1.9 Z"
        fill="url(#cartShade)" stroke="url(#cartGold)" stroke-width="1.7" stroke-linejoin="round"/>

  <!-- Face avant illuminée (décalée pour l'effet 3D) -->
  <path d="M6 9 h16 l-1.6 11.6 a 2.2 2.2 0 0 1 -2.2 1.9 H9.8 a 2.2 2.2 0 0 1 -2.2 -1.9 Z"
        fill="url(#cartGold)" opacity="0.95"/>
  <!-- Reflet vertical (brillance du métal) -->
  <path d="M9 10 h2.6 l-1 10 H9 Z" fill="#ffffff" opacity="0.35"/>
  <!-- Poids du panier : ligne de caisse -->
  <path d="M9.5 13 h9" stroke="#5d3a08" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>

  <!-- Étincelles magiques -->
  <path d="M22.8 3.2 l0.9 2.2 2.2 0.9 -2.2 0.9 -0.9 2.2 -0.9 -2.2 -2.2 -0.9 2.2 -0.9 z" fill="url(#cartGold)"/>
  <path d="M4.6 18.5 l0.8 1.9 1.9 0.8 -1.9 0.8 -0.8 1.9 -0.8 -1.9 -1.9 -0.8 1.9 -0.8 z" fill="#ffd166" opacity="0.9"/>
  <circle cx="23.5" cy="13" r="1.1" fill="#ffd166" opacity="0.85"/>
</svg>
