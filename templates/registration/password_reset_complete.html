{% extends 'boutique/base.html' %}
{% load static %}

{% block title %}Mot de passe réinitialisé — Phone Store{% endblock %}

{% block content %}
<section class="page-section success-page">
    <div class="container">
        <div class="success-box" data-aos="zoom-in">
            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h1>Mot de passe réinitialisé !</h1>
            <p>Votre mot de passe a bien été changé. Vous pouvez maintenant vous connecter.</p>
            <div class="success-actions">
                <a href="{% url 'connexion' %}" class="btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Se connecter</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
