{% extends 'boutique/base.html' %}
{% load static %}

{% block title %}Finaliser ma commande — Phone Store{% endblock %}

{% block content %}
<section class="page-section checkout-page">
    <div class="container">
        <div class="section-header" data-aos="fade-up">
            <h2>📦 Finaliser ma commande</h2>
            <p>Livraison partout à Madagascar</p>
        </div>

        <!-- ===== CHECKOUT DYNAMIQUE (React) ===== -->
        <div id="react-checkout">
            <p style="text-align:center; padding: 48px 0; color: #94a3b8;">
                <i class="fa-solid fa-spinner fa-spin"></i> Chargement de votre commande…
            </p>
        </div>

        <!-- Fallback sans JavaScript : formulaire rendu côté serveur -->
        <noscript>
        <div class="checkout-layout">
            <div class="checkout-form">
                <h3><i class="fa-solid fa-user"></i> Informations de livraison</h3>
                <form method="post" id="checkout-form">
                    {% csrf_token %}
                    <div class="form-row">
                        <div class="form-group">
                            {{ form.nom.label_tag }}
                            {{ form.nom }}
                            {% if form.nom.errors %}<small class="form-error">{{ form.nom.errors|striptags }}</small>{% endif %}
                        </div>
                        <div class="form-group">
                            {{ form.telephone.label_tag }}
                            {{ form.telephone }}
                            {% if form.telephone.errors %}<small class="form-error">{{ form.telephone.errors|striptags }}</small>{% endif %}
                        </div>
                    </div>
                    <div class="form-group">
                        {{ form.email.label_tag }}
                        {{ form.email }}
                        {% if form.email.errors %}<small class="form-error">{{ form.email.errors|striptags }}</small>{% endif %}
                    </div>
                    <div class="form-group">
                        {{ form.adresse.label_tag }}
                        {{ form.adresse }}
                        {% if form.adresse.errors %}<small class="form-error">{{ form.adresse.errors|striptags }}</small>{% endif %}
                    </div>
                    <div class="form-group">
                        {{ form.ville.label_tag }}
                        {{ form.ville }}
                        {% if form.ville.errors %}<small class="form-error">{{ form.ville.errors|striptags }}</small>{% endif %}
                    </div>

                    <div class="payment-methods">
                        <h3><i class="fa-solid fa-wallet"></i> Méthode de paiement</h3>
                        <div class="payment-grid">
                            {% for value, label in form.methode_paiement.field.choices %}
                            <label class="payment-option" data-payment-method="{{ value }}">
                                <input type="radio" name="methode_paiement" value="{{ value }}"
                                    {% if form.methode_paiement.value == value %}checked{% endif %}>
                                <span class="payment-logo">
                                    {% if value == 'carte' %}
                                    <i class="fa-solid fa-credit-card"></i>
                                    {% elif value == 'paypal' %}
                                    <i class="fa-brands fa-paypal"></i>
                                    {% elif value == 'orange_money' %}
                                    <i class="fa-solid fa-mobile-screen-button"></i>
                                    {% else %}
                                    <i class="fa-solid fa-hand-holding-dollar"></i>
                                    {% endif %}
                                </span>
                                <span class="payment-text">
                                    <strong>{{ label }}</strong>
                                </span>
                            </label>
                            {% endfor %}
                        </div>
                    </div>

                    <button type="submit" class="buy-btn submit-order">
                        <i class="fa-solid fa-circle-check"></i> Confirmer ma commande — {{ total }} Ar
                    </button>
                </form>
            </div>

            <aside class="checkout-summary">
                <h3>Ma commande ({{ items|length }})</h3>
                <div class="order-items">
                    {% for item in items %}
                    <div class="order-item">
                        <div class="order-item-img">
                            {% if item.produit.image %}
                            <img src="{{ item.produit.image.url }}" alt="{{ item.produit.nom }}">
                            {% endif %}
                            <span class="order-qty">{{ item.quantite }}</span>
                        </div>
                        <div class="order-item-info">
                            <strong>{{ item.produit.nom }}</strong>
                            <small>{{ item.quantite }} × {{ item.prix }} Ar</small>
                        </div>
                        <strong>{{ item.sous_total }} Ar</strong>
                    </div>
                    {% endfor %}
                </div>
                <div class="summary-line total-line">
                    <span>Total à payer</span>
                    <strong>{{ total }} Ar</strong>
                </div>
            </aside>
        </div>
        </noscript>
    </div>
</section>
{% endblock %}
